<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="hw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101418"/><stop offset="1" stop-color="#1c242c"/>
    </linearGradient>
    <radialGradient id="hl" cx="0.5" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#cfe8e4" stop-opacity="0.5"/><stop offset="1" stop-color="#cfe8e4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182a3e"/><stop offset="1" stop-color="#0d1622"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#hw)"/>
  <ellipse cx="400" cy="90" rx="300" ry="120" fill="url(#hl)"/>
  <!-- window with city glow + rain -->
  <rect x="560" y="60" width="170" height="220" fill="url(#win)" stroke="#2c3a46" stroke-width="8"/>
  <line x1="645" y1="60" x2="645" y2="280" stroke="#2c3a46" stroke-width="6"/>
  <line x1="560" y1="170" x2="730" y2="170" stroke="#2c3a46" stroke-width="6"/>
  <g fill="#f5b942" opacity="0.7">
    <rect x="585" y="110" width="5" height="5"/><rect x="615" y="140" width="5" height="5"/>
    <rect x="670" y="100" width="5" height="5"/><rect x="700" y="150" width="5" height="5"/>
    <rect x="600" y="220" width="5" height="5"/><rect x="690" y="230" width="5" height="5"/>
  </g>
  <g stroke="#9fc3dd" stroke-width="2" opacity="0.35">
    <line x1="575" y1="70" x2="570" y2="95"/><line x1="620" y1="90" x2="615" y2="115"/>
    <line x1="665" y1="75" x2="660" y2="100"/><line x1="710" y1="120" x2="705" y2="145"/>
    <line x1="600" y1="190" x2="595" y2="215"/><line x1="700" y1="200" x2="695" y2="225"/>
  </g>
  <!-- pale ceiling light -->
  <line x1="330" y1="0" x2="330" y2="60" stroke="#2c3a46" stroke-width="4"/>
  <rect x="300" y="60" width="60" height="14" rx="6" fill="#d8efe9" opacity="0.9"/>
  <!-- bed -->
  <rect x="120" y="270" width="330" height="60" rx="10" fill="#39434c"/>
  <rect x="110" y="240" width="40" height="90" rx="8" fill="#2c3a46"/>
  <rect x="140" y="250" width="120" height="26" rx="10" fill="#b9c7cf" opacity="0.8"/>
  <rect x="120" y="330" width="330" height="14" fill="#222b33"/>
  <!-- sitting figure -->
  <g fill="#0a0d10">
    <ellipse cx="330" cy="195" rx="20" ry="23"/>
    <path d="M295,222 q35,-14 70,0 l14,90 -30,4 -10,-52 -12,52 -30,-4 z"/>
  </g>
  <rect x="313" y="190" width="34" height="8" rx="4" fill="#7fd4ff"/>
  <!-- IV stand -->
  <line x1="480" y1="140" x2="480" y2="340" stroke="#4a5a66" stroke-width="5"/>
  <rect x="468" y="140" width="24" height="34" rx="5" fill="#cfe8e4" opacity="0.8"/>
  <path d="M480,176 q0,40 -60,60" stroke="#9fc3dd" stroke-width="2" fill="none" opacity="0.6"/>
  <rect y="344" width="800" height="106" fill="#0b0f13"/>
</svg>
