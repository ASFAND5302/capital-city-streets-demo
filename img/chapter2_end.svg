<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2340"/><stop offset="0.6" stop-color="#5a3a55"/><stop offset="1" stop-color="#c96f3a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd28a"/><stop offset="1" stop-color="#ffd28a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#dawn)"/>
  <!-- rising sun over water -->
  <ellipse cx="560" cy="330" rx="180" ry="90" fill="url(#sun)"/>
  <circle cx="560" cy="330" r="34" fill="#ffdf9e"/>
  <rect y="330" width="800" height="120" fill="#232a44"/>
  <g stroke="#c96f3a" stroke-width="3" opacity="0.55">
    <line x1="480" y1="352" x2="640" y2="352"/><line x1="500" y1="372" x2="620" y2="372"/>
    <line x1="520" y1="392" x2="600" y2="392"/>
  </g>
  <!-- city skyline silhouette -->
  <g fill="#10142a">
    <rect x="30" y="210" width="60" height="130"/><rect x="100" y="170" width="45" height="170"/>
    <rect x="155" y="230" width="70" height="110"/><rect x="235" y="150" width="50" height="190"/>
    <rect x="295" y="240" width="80" height="100"/><rect x="385" y="190" width="40" height="150"/>
  </g>
  <g fill="#f5b942" opacity="0.7">
    <rect x="42" y="225" width="6" height="6"/><rect x="70" y="250" width="6" height="6"/>
    <rect x="112" y="185" width="6" height="6"/><rect x="125" y="215" width="6" height="6"/>
    <rect x="248" y="165" width="6" height="6"/><rect x="265" y="200" width="6" height="6"/>
  </g>
  <!-- island with casino lights far right -->
  <path d="M640,340 q60,-28 130,-6 l30,10 -160,8 z" fill="#131830"/>
  <g fill="#7fd4ff"><circle cx="700" cy="328" r="3"/><circle cx="725" cy="322" r="3"/><circle cx="748" cy="330" r="3"/></g>
  <!-- Bonnie silhouette on the road -->
  <g fill="#08080c">
    <path d="M120,392 l20,-26 h96 l22,26 h16 v22 h-170 v-22 z"/>
    <circle cx="165" cy="418" r="16"/><circle cx="235" cy="418" r="16"/>
  </g>
  <rect x="288" y="398" width="10" height="4" fill="#7fd4ff"/>
</svg>
