<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151018"/><stop offset="1" stop-color="#241a20"/>
    </linearGradient>
    <radialGradient id="candle" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.9"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3f6e"/><stop offset="1" stop-color="#101a33"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#wall)"/>
  <!-- stone arches -->
  <path d="M100,450 v-220 a120,140 0 0 1 240,0 v220" fill="none" stroke="#33262e" stroke-width="10"/>
  <path d="M460,450 v-220 a120,140 0 0 1 240,0 v220" fill="none" stroke="#33262e" stroke-width="10"/>
  <!-- stained window -->
  <path d="M520,120 h120 v140 a60,60 0 0 1 -120,0 z" fill="url(#window)" stroke="#4a3b2a" stroke-width="6"/>
  <line x1="580" y1="120" x2="580" y2="318" stroke="#4a3b2a" stroke-width="4"/>
  <line x1="520" y1="200" x2="640" y2="200" stroke="#4a3b2a" stroke-width="4"/>
  <!-- candle glow -->
  <ellipse cx="215" cy="290" rx="150" ry="120" fill="url(#candle)" opacity="0.6"/>
  <!-- candles -->
  <g>
    <rect x="185" y="330" width="8" height="26" fill="#e8dcc0"/>
    <rect x="210" y="322" width="8" height="34" fill="#e8dcc0"/>
    <rect x="235" y="330" width="8" height="26" fill="#e8dcc0"/>
    <ellipse cx="189" cy="325" rx="4" ry="7" fill="#ffcc66"/>
    <ellipse cx="214" cy="317" rx="4" ry="8" fill="#ffcc66"/>
    <ellipse cx="239" cy="325" rx="4" ry="7" fill="#ffcc66"/>
    <rect x="160" y="356" width="110" height="12" fill="#3a2c22"/>
  </g>
  <!-- priest silhouette with collar -->
  <g fill="#0a0708">
    <ellipse cx="430" cy="235" rx="21" ry="24"/>
    <path d="M392,265 q38,-15 76,0 l14,150 -104,0 z"/>
  </g>
  <rect x="420" y="258" width="20" height="8" fill="#f2efe6"/>
  <!-- pew in front -->
  <rect x="250" y="400" width="320" height="18" fill="#2c1f18"/>
  <rect y="425" width="800" height="25" fill="#0b0809"/>
</svg>
