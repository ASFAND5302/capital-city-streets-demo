<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0a1a"/><stop offset="1" stop-color="#241233"/>
    </linearGradient>
    <radialGradient id="neon" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ff3d7f" stop-opacity="0.85"/><stop offset="1" stop-color="#ff3d7f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#7a4d12"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sky)"/>
  <!-- brick walls -->
  <rect x="0" y="60" width="800" height="330" fill="#1a1420"/>
  <g stroke="#241c2e" stroke-width="3">
    <line x1="0" y1="110" x2="800" y2="110"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="210" x2="800" y2="210"/><line x1="0" y1="260" x2="800" y2="260"/>
    <line x1="0" y1="310" x2="800" y2="310"/><line x1="0" y1="360" x2="800" y2="360"/>
  </g>
  <!-- neon sign glow -->
  <ellipse cx="400" cy="95" rx="260" ry="90" fill="url(#neon)"/>
  <text x="400" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="46" font-weight="bold" fill="#ff5d98" letter-spacing="8">VELVET ROOM</text>
  <!-- back door with light spill -->
  <polygon points="520,390 560,180 640,180 680,390" fill="#111" opacity="0.7"/>
  <rect x="545" y="185" width="110" height="205" fill="url(#door)"/>
  <rect x="545" y="185" width="110" height="205" fill="none" stroke="#000" stroke-width="6"/>
  <polygon points="545,390 655,390 760,450 430,450" fill="#ffb347" opacity="0.18"/>
  <!-- crates -->
  <rect x="90" y="300" width="90" height="90" fill="#2c2135" stroke="#3d2f4a" stroke-width="4"/>
  <rect x="140" y="240" width="70" height="60" fill="#251b2e" stroke="#3d2f4a" stroke-width="4"/>
  <!-- steam -->
  <g stroke="#8a7ba0" stroke-width="5" fill="none" opacity="0.35">
    <path d="M320,440 q15,-40 0,-80 q-15,-40 5,-70"/>
    <path d="M360,440 q-12,-35 3,-75 q12,-35 -2,-60"/>
  </g>
  <!-- silhouette approaching -->
  <g fill="#05050a">
    <ellipse cx="230" cy="255" rx="17" ry="20"/>
    <path d="M210,272 q20,-8 42,0 l10,95 -18,4 -8,-50 -6,50 -18,-2 z"/>
    <path d="M212,290 q-25,10 -30,35 l8,6 q12,-20 26,-26 z"/>
  </g>
  <rect y="390" width="800" height="60" fill="#0a0810"/>
</svg>
